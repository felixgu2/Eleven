{% extends "base.html" %}
{% block title %}AI Coach{% endblock %}
{% block topbar %}
<div class="topbar">
  <a href="{{ url_for('dashboard') }}" class="back">←</a>
  <h1>AI Coach</h1>
  <span class="points-chip">🚶 {{ steps }}</span>
</div>
{% endblock %}
{% block content %}
<div class="chat-scroll" id="chat-scroll" style="padding-bottom:60px;">
  {% for m in messages %}
    <div class="bubble {{ m.sender }}">{{ m.text }}</div>
  {% endfor %}
</div>
<div class="chat-input-row">
  <button class="mic-btn" id="mic-btn" title="Hold to speak">🎤</button>
  <input type="text" id="chat-text" placeholder="Type a message...">
  <button class="btn btn-primary btn-sm" id="send-btn">Send</button>
</div>
{% endblock %}
{% block scripts %}
<script>
const scrollEl = document.getElementById('chat-scroll');
scrollEl.scrollTop = scrollEl.scrollHeight;

function addBubble(sender, text) {
  const div = document.createElement('div');
  div.className = `bubble ${sender}`;
  div.textContent = text;
  scrollEl.appendChild(div);
  scrollEl.scrollTop = scrollEl.scrollHeight;
  return div;
}

const sendBtn = document.getElementById('send-btn');
const input = document.getElementById('chat-text');

async function sendMessage(text) {
  if (!text.trim()) return;
  addBubble('user', text);
  input.value = '';
  sendBtn.disabled = true;
  const typingBubble = addBubble('coach', 'Thinking…');
  typingBubble.style.opacity = '0.6';

  try {
    const res = await postJSON("{{ url_for('coach_message') }}", { text });
    typingBubble.remove();
    if (res.ok) {
      addBubble('coach', res.reply);
    } else {
      addBubble('coach', "Sorry, something went wrong — please try again.");
    }
  } catch (e) {
    typingBubble.remove();
    addBubble('coach', "Sorry, something went wrong — please try again.");
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage(input.value);
});

// Optional voice input via Web Speech API (press and hold the mic).
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('mic-btn');
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    input.value = transcript;
  };
  recognition.onend = () => { micBtn.classList.remove('listening'); };
  const start = () => { try { recognition.start(); micBtn.classList.add('listening'); } catch (e) {} };
  const stop = () => { try { recognition.stop(); } catch (e) {} };
  micBtn.addEventListener('mousedown', start);
  micBtn.addEventListener('touchstart', start);
  micBtn.addEventListener('mouseup', stop);
  micBtn.addEventListener('mouseleave', stop);
  micBtn.addEventListener('touchend', stop);
} else {
  micBtn.addEventListener('click', () => showToast('Voice input not supported in this browser — please type instead.'));
}
</script>
{% endblock %}
