<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CareForward{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="app-frame">
  {% if not hide_nav or force_header %}
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ url_for('dashboard') }}" class="brand">💚 CareForward</a>
      <nav class="site-nav">
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Home</a>
        <a href="{{ url_for('map_page') }}" class="{% if request.endpoint == 'map_page' %}active{% endif %}">Map</a>
        <a href="{{ url_for('coach_page') }}" class="{% if request.endpoint == 'coach_page' %}active{% endif %}">Coach</a>
        <a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">Profile</a>
      </nav>
    </div>
  </header>
  {% endif %}
  {% block topbar %}{% endblock %}
  <main class="app-content {% if hide_nav %}no-nav{% endif %} {% if wide %}wide{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% if not hide_nav %}
  <nav class="bottom-nav">
    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">🏠</span><span>Home</span>
    </a>
    <a href="{{ url_for('map_page') }}" class="nav-item {% if request.endpoint == 'map_page' %}active{% endif %}">
      <span class="nav-icon">🗺️</span><span>Map</span>
    </a>
    <a href="{{ url_for('coach_page') }}" class="nav-item {% if request.endpoint == 'coach_page' %}active{% endif %}">
      <span class="nav-icon">💬</span><span>Coach</span>
    </a>
    <a href="{{ url_for('profile') }}" class="nav-item {% if request.endpoint == 'profile' %}active{% endif %}">
      <span class="nav-icon">👤</span><span>Profile</span>
    </a>
  </nav>
  {% endif %}
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
