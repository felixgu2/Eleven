{% extends "base.html" %}
{% block title %}Log In - WalklyMiles{% endblock %}
{% set hide_nav = true %}
{% block content %}
<div class="onboarding" style="justify-content:flex-start; padding-top:60px;">
  <img src="{{ url_for('static', filename='img/logo-icon.png') }}" alt="WalklyMiles" class="auth-logo-icon">
  <h1>Welcome back</h1>
  <p>Log in to continue your recovery plan.</p>

  <form method="post" action="{{ url_for('login') }}" style="width:100%; max-width:340px;">
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>
  <div class="login-hint">Don't have an account? <a href="{{ url_for('signup') }}" class="link-btn">Sign up</a></div>
</div>
{% endblock %}
